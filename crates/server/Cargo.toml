[package]
name = "server"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
poem = { version = "=3.1.12", features = ["rustls"] }
poem-openapi = { version = "=5.1.16" }
tokio = { version = "=1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "signal",
] }
cliclack = { version = "=0.5.5" }
ctrlc = { version = "=3.5.2" }
color-eyre = { version = "=0.6.5" }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
  "fmt",
  "ansi",
  "std",
  "smallvec",
] }
